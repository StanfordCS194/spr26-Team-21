[tool.poetry]
name = "aperture-backend"
version = "0.2.0"
description = "Aperture backend — statistical data synthesis pipeline."
authors = ["Aperture Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.111.0"
uvicorn = {version = ">=0.29.0", extras = ["standard"]}
python-multipart = ">=0.0.9"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
scipy = ">=1.13.0"
openpyxl = ">=3.1.0"
pyarrow = ">=16.0.0"
python-dotenv = ">=1.0.0"
anthropic = ">=0.28.0"
sdv = ">=1.11.0"
pymongo = ">=4.7.0"
dnspython = ">=2.6.0"
boto3 = ">=1.34.0"
xgboost = ">=2.0.0"
scikit-learn = ">=1.4.0"
pyyaml = ">=6.0"
imbalanced-learn = ">=0.12.0"
# anonymeter is OPTIONAL — pins scikit-learn~=1.2 which conflicts with SDV's
# newer sklearn requirement. The privacy_attacks module gracefully degrades to
# distance-MIA + DOMIAS when anonymeter is missing. To enable the GDPR-aligned
# attack ensemble, install separately:
#   pip install --no-deps anonymeter
# (--no-deps lets us keep the rest of the stack at modern sklearn versions.)

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers -ra"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
